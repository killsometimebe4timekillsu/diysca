services:
  diysca:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      - ./data:/data                      # SQLite DB + OSV mirror
      - ./config.yml:/config/config.yml:ro
      - ./inventories:/inventories:ro     # your Ansible inventories
      - ~/.ssh/diysca_ed25519:/keys/id_ed25519:ro
      - ~/.ssh/known_hosts:/keys/known_hosts:ro
