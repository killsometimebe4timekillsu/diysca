[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diysca"
version = "0.2.4"
description = "Poor man's DIY CVE scanner: agentless SSH scans, OSV/NVD/KEV correlation, repo awareness, SBOMs, Apprise alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "asyncssh>=2.14",
  "cryptography>=41",
  "pyyaml>=6",
  "apprise>=1.7",
  "psycopg[binary]>=3.1",
  "packaging>=23",
]

[project.optional-dependencies]
zstd = ["zstandard>=0.22"]
ansible = ["ansible-core>=2.15"]
dev = ["pytest>=8"]

[project.scripts]
diysca = "diysca.cli:main"

[tool.setuptools.packages.find]
include = ["diysca*"]

[tool.setuptools.package-data]
diysca = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
