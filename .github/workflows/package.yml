name: package
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  standalone:
    name: native packages (deb, rpm) + AppImage
    runs-on: ubuntu-latest
    # Build on EL8 (glibc 2.28) so the bundle runs on RHEL/Rocky/Alma 8+, Debian 10+, Ubuntu 20.04+.
    container: docker.io/library/almalinux:8
    steps:
      - name: build deps
        run: |
          dnf install -y -q python3.12 python3.12-devel binutils git file findutils tar gzip
      - uses: actions/checkout@v4
      - name: version
        run: echo "VERSION=$(python3.12 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_ENV"
      - name: standalone bundle
        run: PYTHON=python3.12 packaging/scripts/build-standalone.sh
      - name: nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm
      - name: deb + rpm
        run: |
          ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          packaging/scripts/build-appimage.sh
      - name: smoke test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./dist/diysca-*.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  test-deb:
    needs: standalone
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: native }
      - run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ./diysca_*.deb
          diysca --version
          getent passwd diysca
          test -f /etc/diysca/config.yml && test -f /usr/lib/systemd/system/diysca.service
          export DIYSCA_DATABASE_URL=   # package tests use SQLite; PostgreSQL is covered by ci.yml and the OCI job
          DIYSCA_DATA_DIR=/tmp/d diysca add-host self --local
          DIYSCA_DATA_DIR=/tmp/d DIYSCA_REPO_FETCH=off DIYSCA_NVD_ENABLED=0 DIYSCA_KEV_ENABLED=0 DIYSCA_OSV_MODE=bulk diysca scan --no-alerts

  test-rpm:
    needs: standalone
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "docker.io/library/almalinux:8", install: "dnf install -y ./diysca-*.rpm" }
          - { image: "docker.io/library/rockylinux:9", install: "dnf install -y ./diysca-*.rpm" }
          - { image: "registry.access.redhat.com/ubi10/ubi:latest", install: "dnf install -y ./diysca-*.rpm" }
          - { image: "registry.suse.com/bci/bci-base:16.0", install: "zypper --non-interactive install --allow-unsigned-rpm ./diysca-*.rpm" }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: native }
      - name: install and smoke test
        run: |
          cat /etc/os-release | head -3
          ${{ matrix.install }}
          diysca --version
          getent passwd diysca
          test -f /etc/diysca/config.yml && test -f /usr/lib/systemd/system/diysca.service
          export DIYSCA_DATABASE_URL=   # package tests use SQLite; PostgreSQL is covered by ci.yml and the OCI job
          DIYSCA_DATA_DIR=/tmp/d diysca add-host self --local
          DIYSCA_DATA_DIR=/tmp/d DIYSCA_REPO_FETCH=scanner DIYSCA_NVD_ENABLED=0 DIYSCA_KEV_ENABLED=0 DIYSCA_OSV_MODE=bulk diysca scan --no-alerts | tee /tmp/scan.json
          DIYSCA_DATA_DIR=/tmp/d diysca hosts
          # the scan itself must succeed (feed coverage for a brand-new release may still be partial)
          ! grep -q '"error": "no package manager' /tmp/scan.json
          DIYSCA_DATA_DIR=/tmp/d diysca sbom self | head -c 400

  flatpak:
    # Built on the runner with its own copy of the SDK. The flathub-infra build image has the SDK baked into an
    # image layer; as soon as Flathub publishes a newer SDK, flatpak-builder tries to update it there and fails with
    # "Invalid cross-device link" (seen with 24.08 and again with 26.08).
    runs-on: ubuntu-latest
    env:
      APP_ID: io.github.killsometimebe4timekillsu.diysca
    steps:
      - uses: actions/checkout@v4
      - name: install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          # the runner image restricts unprivileged user namespaces, which the build sandbox needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo flatpak-build packaging/flatpak/$APP_ID.yml
          flatpak build-bundle flatpak-repo diysca.flatpak $APP_ID
      - name: smoke test
        run: |
          flatpak install --user -y --noninteractive diysca.flatpak
          flatpak run $APP_ID --version
      - uses: actions/upload-artifact@v4
        with:
          name: diysca-flatpak
          path: diysca.flatpak

  oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build (buildah)
        run: buildah bud --format oci -t diysca:ci -f Containerfile .
      - name: smoke test (podman + PostgreSQL)
        run: |
          # host networking: the smoke test is about the image, not the runner's rootless port forwarding
          podman run -d --name pg --network host -e POSTGRES_USER=diysca -e POSTGRES_PASSWORD=diysca docker.io/library/postgres:17
          for i in $(seq 1 30); do podman exec pg pg_isready -U diysca && break; sleep 1; done
          podman run -d --name diysca --network host \
            -e DIYSCA_WEB_USER=admin -e DIYSCA_WEB_PASSWORD=ci-smoke-test \
            -e DIYSCA_DATABASE_URL=postgresql://diysca:diysca@127.0.0.1:5432/diysca diysca:ci
          ok=
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && { ok=1; break; }; sleep 1; done
          podman ps -a
          podman logs diysca
          test -n "$ok"
          curl -fsS -u admin:ci-smoke-test http://127.0.0.1:8080/findings >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/findings)" = 401
          podman exec diysca diysca --version
          podman exec pg psql -U diysca -c '\dt' | grep findings
          podman rm -f diysca pg
      - name: push to ghcr.io
        if: github.event_name == 'push'
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          TAG=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || TAG=edge
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag diysca:ci "$IMG:$TAG"
          podman push "$IMG:$TAG"
          if [ "$GITHUB_REF_TYPE" = tag ]; then podman tag diysca:ci "$IMG:latest" && podman push "$IMG:latest"; fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [standalone, test-deb, test-rpm, flatpak, oci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
