# diysca configuration. Every key can also be set as env var DIYSCA_<KEY> (e.g. DIYSCA_NVD_API_KEY).
# Location: native package /etc/diysca/config.yml · OCI image /config/config.yml
#           AppImage/Flatpak/CLI ~/.config/diysca/config.yml (or ./config.yml, or $DIYSCA_CONFIG)

# Database. PostgreSQL is the default for server installs:
#   sudo -u postgres createuser -P diysca && sudo -u postgres createdb -O diysca diysca
database_url: postgresql://diysca:change-me@localhost:5432/diysca
# Leave empty to use a SQLite file in the data dir instead (fine for the AppImage/Flatpak on a laptop).

# Ansible inventories (files or directories). Re-read before every scan.
inventories: []
#  - /etc/ansible/hosts              # native package / AppImage / Flatpak
#  - /inventories/hosts.ini          # OCI image (mount your inventories at /inventories)
use_ansible_inventory_cli: true   # use `ansible-inventory --list` if installed (dynamic inventories, vault)

# Inventory providers: systems straight from hypervisors, clouds and clusters (docs/inventory-providers.md).
# Re-read before every scheduled scan, like inventories. Secrets: *_env (environment variable) or *_file.
inventory_providers: []
#  - {type: proxmox, name: pve, url: https://pve1:8006, token_id: "diysca@pve!scan", token_secret_env: PVE_TOKEN, user: root}
#  - {type: vsphere, name: vc, url: https://vcenter.example.org, username: ro@vsphere.local, password_env: VC_PW}
#  - {type: libvirt, name: kvm1, uri: "qemu+ssh://root@kvm1/system", hypervisor: true}
#  - {type: openstack, name: cloud, auth_url: https://keystone:5000/v3, application_credential_id: "...",
#     application_credential_secret_env: OS_APP_SECRET, region: RegionOne}
#  - {type: kubernetes, name: prod, url: https://k8s-api:6443, token_env: K8S_TOKEN, ca_file: /etc/diysca/k8s-ca.pem}
#  - {type: openshift, name: ocp, url: https://api.ocp.example.org:6443, token_env: OCP_TOKEN, user: core}
#  - {type: aws, name: aws-eu, regions: [eu-central-1], access_key_id_env: AWS_ACCESS_KEY_ID,
#     secret_access_key_env: AWS_SECRET_ACCESS_KEY, filters: {"tag:env": prod}}
#  - {type: azure, name: az, tenant_id: "...", client_id: "...", client_secret_env: AZURE_CLIENT_SECRET}
#  - {type: azure, name: az, managed_identity: true}
#  - {type: gcp, name: gcp, projects: [prod-123], credentials_file: /etc/diysca/gcp-sa.json}
#  - {type: hetzner, name: hcloud, token_env: HCLOUD_TOKEN, label_selector: "env=prod"}
# Other clouds (DigitalOcean, OVH, Scaleway): list their Ansible inventory plugin file under inventories.

# Modules (docs/modules.md). Scanning is always on. Default: all of them.
# modules: [alerting, mitigation, auth]

# SSH (agentless). Per-host ansible_user / ansible_port / ansible_ssh_private_key_file win.
ssh_user: diysca                  # an unprivileged user is enough, no sudo needed
# Defaults: ssh-agent and ~/.ssh/id_* + ~/.ssh/known_hosts of the user diysca runs as
# (native package: /var/lib/diysca/.ssh/). For the OCI image mount them and set:
# ssh_key: /keys/id_ed25519
# ssh_known_hosts: /keys/known_hosts   # or "ignore" (not recommended)
scan_concurrency: 8
scan_interval_hours: 12           # 0 = only scan on demand

# Language packages (PyPI, npm, RubyGems, Maven jars, Packagist, crates.io, Go): installed packages and
# lockfiles below these paths. Distro-owned dirs like /usr/lib/python3 are left to the OS package scan.
scan_languages: true
# lang_scan_paths: [/opt, /srv, /usr/local, /home, /root, /var/www, /var/lib/jenkins, /usr/lib/node_modules]

# Container images: on each host, one running container per image is scanned as its own system
# ("<host>/<container>"). The SSH user needs access to the runtime (rootless podman, docker group,
# or container_sudo: true plus a NOPASSWD sudo rule for the runtime binary).
scan_containers: true
# container_runtimes: [podman, docker, nerdctl, crictl]
container_sudo: false

# Who downloads the package indexes of the repos configured on each host:
#   scanner = this server (default) | host = the host itself via curl/wget over SSH
#   (use "host" for internal mirrors only reachable from the host's network) | off
repo_fetch: scanner

# Vulnerability data
osv_mode: api                     # api = api.osv.dev | bulk = mirror per-distro zip locally (works offline/air-gapped)
# osv_bulk_url: https://osv-vulnerabilities.storage.googleapis.com   # or file:///mirror (expects <Ecosystem>/all.zip)
nvd_enabled: true
nvd_api_key: ""                   # free key from nvd.nist.gov makes enrichment ~10x faster
# NVD lookups run after scans in the background (CLI: before it returns), time-boxed per run:
# nvd_budget_seconds: 0           # 0 = 90 s without a key, 600 s with one; the next run continues
kev_enabled: true

# Extra CVE sources, on top of OSV / NVD / KEV. Each is downloaded every `refresh_hours`,
# converted to OSV records and matched like OSV data. You can also add sources in the web UI
# (CVE sources page); the ones defined here can only be changed here.
sources: []
#  - name: debian-tracker              # CVEs Debian hasn't fixed yet, with Debian's urgency
#    type: debian-tracker
#    releases: [bookworm, trixie]      # default: the releases your hosts run
#  - name: alpine-main
#    type: alpine-secdb
#    url: https://secdb.alpinelinux.org/v3.20/main.json
#  - name: epss                        # exploit probability per CVE (enrichment only)
#    type: epss
#  - name: ghsa                        # any OSV-format feed: zip, JSON list, NDJSON or a directory
#    type: osv
#    path: /srv/mirror/advisory-database/advisories/github-reviewed
#    ecosystems: [npm, PyPI, Maven]
#  - name: acme                        # your own feed, mapped field by field
#    type: custom
#    url: https://intranet.example/advisories.json
#    headers: {Authorization: "Bearer CHANGE-ME"}
#    format: json                      # json | yaml | csv
#    records: data.advisories          # where the list of records is
#    refresh_hours: 6
#    fields:
#      id: advisory_id
#      aliases: cves
#      package: product.name
#      ecosystem: product.ecosystem    # e.g. Debian:12, Red Hat:enterprise_linux:10, PyPI, npm
#      introduced: since
#      fixed: fixed_in                 # or versions: [...] / last_affected
#      severity: severity
#      cvss: score                     # number or CVSS:3.x vector
#      summary: title
#    defaults:
#      ecosystem: "Debian:12"

# Web UI
base_url: https://diysca.example.org   # used for links in alerts
# web_user: admin                 # set both to enable basic auth (put a TLS reverse proxy in front!)
# web_password: change-me

# Self-hosted repositories that diysca may update when a fix is released upstream but
# missing from your mirror (Patching > Repositories, or `diysca repo-update NAME --run`).
# `match` = URL prefixes your hosts use for this repo's content.
repo_managers: []
#  - name: aptly
#    type: aptly
#    url: http://aptly.internal:8080          # aptly API
#    match: [http://aptly.internal/debian]
#    mirrors:                                 # mirror update -> snapshot ...
#      - { name: bookworm-main, component: main }
#      - { name: bookworm-security, component: security }
#    publish: { prefix: debian, distribution: bookworm }   # ... -> publish switch
#
#  - name: pulp
#    type: pulp
#    url: https://pulp.internal
#    username: admin
#    password_env: PULP_PASSWORD               # read from this env var
#    match: [https://pulp.internal/pulp/content/]
#    repositories:                            # sync -> publication -> distribution
#      - { type: rpm, name: rocky9-baseos, distribution: rocky9-baseos }
#      - { type: deb, name: debian12-main, distribution: debian12 }
#
#  - name: satellite
#    type: foreman                            # Foreman + Katello (also Red Hat Satellite / orcharhino)
#    url: https://foreman.internal
#    username: admin
#    password_env: FOREMAN_PASSWORD
#    organization: ACME
#    match: [https://foreman.internal/pulp/content/]
#    repositories: [Rocky 9 BaseOS x86_64, Rocky 9 AppStream x86_64]   # synced first
#    content_view: CV-Rocky9                  # then a new version is published
#    composite_content_view: CCV-Rocky9       # optional
#    promote_to: [Test, Prod]                 # lifecycle stages offered in the UI

# --- API tokens, approvals, hand-off (docs/api.md, docs/mitigations.md) ---
# Agents, CI/CD jobs and MCP clients send "Authorization: Bearer <token>". Tokens open /api/* and /mcp only.
# Generate with: openssl rand -hex 32
# api_tokens:
#   ci: "replace-with-a-long-random-string"
#   agent-dmz: "another-long-random-string"
# Let token holders approve and cancel mitigations themselves (default: only people can approve)
# agents_can_approve: false
# Hand-off targets (webhook, github, gitlab) are managed under Settings > Hand-off or imported as YAML.

# --- Login, roles and audit (auth module, docs/auth.md) ---
# OIDC single sign-on: Keycloak, Entra ID, Authentik, Zitadel, Okta, Google, GitLab, Dex, ...
# oidc:
#   issuer: https://sso.example.org/realms/acme
#   client_id: diysca
#   client_secret_env: DIYSCA_OIDC_SECRET
#   scopes: [openid, profile, email, groups]
#   username_claim: preferred_username
#   groups_claim: groups            # dotted paths work: realm_access.roles
# Roles: viewer < operator < approver < admin. hosts limits a binding to some systems.
# rbac:
#   default_role: ""                # role for users no binding matches ("" = no access)
#   bindings:
#     - {group: secops, role: admin}
#     - {group: dba, role: approver, hosts: "group:db"}
#     - {email: "*@ops.example.org", role: operator}
# API tokens with a role and a scope:
# api_tokens:
#   ci: {token: "long-random-string", role: operator, hosts: "group:dmz"}
# session_hours: 8
# audit_days: 365                   # audit log retention
