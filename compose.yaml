# Compose spec: works with "podman compose", "nerdctl compose", "docker compose", ...
services:
  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: diysca
      POSTGRES_PASSWORD: ${DIYSCA_DB_PASSWORD:-change-me}
      POSTGRES_DB: diysca
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "diysca"]
      interval: 5s
      retries: 20

  diysca:
    image: ghcr.io/killsometimebe4timekillsu/diysca:latest
    build: { context: ., dockerfile: Containerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DIYSCA_DATABASE_URL: postgresql://diysca:${DIYSCA_DB_PASSWORD:-change-me}@db:5432/diysca
      # The UI login. diysca refuses to listen on the network without one (or use OIDC, see docs/auth.md).
      DIYSCA_WEB_USER: ${DIYSCA_WEB_USER:-admin}
      DIYSCA_WEB_PASSWORD: ${DIYSCA_WEB_PASSWORD:?set DIYSCA_WEB_PASSWORD, the password of the web login}
    ports: ["8080:8080"]
    volumes:
      - data:/data                        # OSV bulk mirror cache
      - ./config.yml:/config/config.yml:ro
      - ./inventories:/inventories:ro     # your Ansible inventories
      - ./keys:/keys:ro                   # id_ed25519 + known_hosts

volumes:
  db:
  data:
