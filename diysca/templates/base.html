<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}diysca{% endblock %} · diysca</title>
{% if running %}<meta http-equiv="refresh" content="10">{% endif %}
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#677084;--line:#e2e5ea;--acc:#2f6fdf;
--crit:#b3261e;--high:#e2541b;--med:#c98a00;--low:#4a7fc1;--unk:#8a90a0;--ok:#2e8b57}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2027;--fg:#e4e7ec;--muted:#98a1b3;--line:#2c323c;--acc:#6ea0ff}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--card);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:16px;padding:12px 0}header nav a{padding:14px 8px;display:inline-block;color:var(--muted)}
header nav a.on{color:var(--fg);border-bottom:2px solid var(--acc)}header .spacer{flex:1}
main{max-width:1400px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;overflow-x:auto}
h1{font-size:20px;margin:4px 0 14px}h2{font-size:15px;margin:0 0 10px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr:hover td{background:color-mix(in srgb,var(--acc) 5%,transparent)}
.sev{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;background:var(--unk)}
.sev.CRITICAL{background:var(--crit)}.sev.HIGH{background:var(--high)}.sev.MEDIUM{background:var(--med)}.sev.LOW{background:var(--low)}
.tag{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--muted);margin:1px}
.kev{background:#000;color:#ff0;padding:1px 5px;border-radius:3px;font-size:11px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--crit)}.muted{color:var(--muted)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}.stat b{font-size:24px;display:block}
form.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
form.filters label,form.stack label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
input,select,button{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)}
button,.btn{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer;padding:5px 12px;border-radius:5px;display:inline-block}
button.secondary{background:transparent;color:var(--acc)}button.danger{background:transparent;color:var(--crit);border-color:var(--crit)}
form.inline{display:inline}.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:300px}
.saved{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px}
.saved .chip{border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 10px;display:inline-flex;gap:4px;align-items:center}
.saved .chip button{padding:0 6px;background:none;border:0;color:var(--muted)}
.notice{background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:6px;padding:8px 12px;margin-bottom:12px}
pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<header>
  <span class="brand">🛡️ diysca</span>
  <nav>
    <a href="/" class="{{ 'on' if page=='dashboard' }}">Dashboard</a>
    <a href="/systems" class="{{ 'on' if page in ('systems','system') }}">Systems</a>
    <a href="/packages" class="{{ 'on' if page=='packages' }}">Packages</a>
    <a href="/findings" class="{{ 'on' if page in ('findings','finding') }}">Findings</a>
    <a href="/patching" class="{{ 'on' if page=='patching' }}">Patching</a>
    <a href="/alerts" class="{{ 'on' if page=='alerts' }}">Alerts</a>
  </nav>
  <span class="spacer"></span>
  {% if running %}<span class="muted">⏳ scan running…</span>{% endif %}
  <form method="post" action="/scan" class="inline"><button>Scan all</button></form>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer style="text-align:center" class="muted"><small>diysca {{ version }} · data: OSV.dev, NVD, CISA KEV</small></footer>
</body>
</html>
